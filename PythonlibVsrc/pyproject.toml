[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PythonlibVsrc"
version = "0.1.0"
description = "Python library for SemiQon STM32 voltage source control"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
	"pyvisa>=1.13",
	"pyvisa-py>=0.7",
]

[tool.setuptools]
packages = ["PythonlibVsrc"]

[tool.setuptools.package-dir]
PythonlibVsrc = "."
